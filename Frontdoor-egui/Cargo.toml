[package]
name = "pluto-frontdoor-egui"
version = "0.1.0"
edition = "2021"
description = "Native egui frontend for Pluto (replaces the webview UI)"
license = "MIT"

[[bin]]
name = "pluto-frontdoor"
path = "src/main.rs"

[dependencies]
# Windowing + immediate mode UI.
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "system_fonts"] }
egui = "=0.37.0"
pluto-timeline-core = { path = "../Backdoor/timeline-core" }
pluto-media-engine = { path = "../Backdoor/media-engine" }
serde_json = "1"
rfd = "0.15"

# Logo (.ico) decoding for the title bar mark.
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
