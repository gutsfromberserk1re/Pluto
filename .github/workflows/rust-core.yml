name: Rust core performance

on:
  push:
    branches: ["**"]
    paths:
      - "Backdoor/timeline-core/**"
      - "Backdoor/pixel-core/**"
      - "Backdoor/media-engine/**"
      - "Backdoor/Cargo.toml"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "Backdoor/timeline-core/**"
      - "Backdoor/pixel-core/**"
      - "Backdoor/media-engine/**"
      - "Backdoor/Cargo.toml"
      - ".github/workflows/rust-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Core tests and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain
        continue-on-error: true
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        continue-on-error: true
        with:
          workspaces: Backdoor -> target
      - name: Install FFmpeg tools
        id: ffmpeg-install
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Check Rust workspace
        id: workspace-check
        continue-on-error: true
        run: cargo check --workspace
        working-directory: Backdoor
      - name: Run Rust workspace tests
        id: workspace-test
        continue-on-error: true
        run: cargo test --workspace
        working-directory: Backdoor
      - name: Run timeline benchmark
        id: timeline-bench
        continue-on-error: true
        run: mkdir -p target && cargo bench -p pluto-timeline-core --bench timeline > target/timeline-bench.csv
        working-directory: Backdoor
      - name: Run pixel benchmark
        id: pixel-bench
        continue-on-error: true
        run: mkdir -p target && cargo bench -p pluto-pixel-core --bench pixels > target/pixel-bench.csv
        working-directory: Backdoor
      - uses: actions/setup-python@v5
        id: python-setup
        continue-on-error: true
        with:
          python-version: "3.x"
      - name: Benchmark FFmpeg media import path
        id: media-bench
        continue-on-error: true
        run: mkdir -p Backdoor/target && python3 Backdoor/benchmarks/media.py > Backdoor/target/media-bench.csv
      - uses: actions/upload-artifact@v4
        id: benchmark-artifact
        if: always()
        continue-on-error: true
        with:
          name: Pluto-Performance-Benchmarks
          if-no-files-found: warn
          path: |
            Backdoor/target/timeline-bench.csv
            Backdoor/target/pixel-bench.csv
            Backdoor/target/media-bench.csv
      - name: Summarize completed checks
        if: always()
        shell: bash
        env:
          CHECK_OUTCOMES: ${{ steps.rust-toolchain.outcome }},${{ steps.rust-cache.outcome }},${{ steps.ffmpeg-install.outcome }},${{ steps.workspace-check.outcome }},${{ steps.workspace-test.outcome }},${{ steps.timeline-bench.outcome }},${{ steps.pixel-bench.outcome }},${{ steps.python-setup.outcome }},${{ steps.media-bench.outcome }},${{ steps.benchmark-artifact.outcome }}
        run: |
          echo "Core check outcomes: $CHECK_OUTCOMES"
          if [[ ",$CHECK_OUTCOMES," == *",failure,"* ]]; then
            echo "One or more core checks failed; see the completed steps above."
            exit 1
          fi
