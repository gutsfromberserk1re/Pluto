name: Rust and Tauri

on:
  push:
    paths:
      - "Backdoor/**"
      - "Frontdoor/**"
      - ".github/workflows/rust-tauri.yml"
  pull_request:
    paths:
      - "Backdoor/**"
      - "Frontdoor/**"
      - ".github/workflows/rust-tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-benchmarks:
    name: Rust, browser, and media performance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backdoor -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-ubuntu-1.63.0
      - name: Install benchmark dependencies
        run: npm --prefix Backdoor/benchmarks install --no-package-lock --no-audit --no-fund
      - name: Install headless Chromium
        run: Backdoor/benchmarks/node_modules/.bin/playwright install --with-deps chromium
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: cargo check -p pluto-timeline-core -p pluto-pixel-core
        working-directory: Backdoor
      - run: cargo test -p pluto-timeline-core
        working-directory: Backdoor
      - run: cargo test -p pluto-pixel-core
        working-directory: Backdoor
      - name: Record timeline reference comparison
        shell: bash
        run: cargo bench -p pluto-timeline-core --bench timeline > target/timeline-bench.csv
        working-directory: Backdoor
      - name: Record pixel reference comparison
        shell: bash
        run: cargo bench -p pluto-pixel-core --bench pixels > target/pixel-bench.csv
        working-directory: Backdoor
      - name: Check Frontdoor JavaScript syntax
        run: |
          node --check Frontdoor/scripts/app.js
          node --check Frontdoor/scripts/tauri-timeline.js
      - name: Record browser preview performance
        run: node Backdoor/benchmarks/preview.mjs > Backdoor/target/preview-bench.csv
      - name: Record FFmpeg media import performance
        run: python3 Backdoor/benchmarks/media.py > Backdoor/target/media-bench.csv
      - uses: actions/upload-artifact@v4
        with:
          name: Pluto-Performance-Benchmarks
          if-no-files-found: error
          path: |
            Backdoor/target/timeline-bench.csv
            Backdoor/target/pixel-bench.csv
            Backdoor/target/preview-bench.csv
            Backdoor/target/media-bench.csv

  tauri-windows:
    name: Portable Windows preview build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached FFmpeg tools
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: Backdoor/desktop/src-tauri/ffmpeg
          # Bump v1 when you want this job to fetch a newer Chocolatey FFmpeg package.
          key: ffmpeg-windows-x64-chocolatey-v1
      - name: Install FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Stage FFmpeg for the desktop bundle
        id: ffmpeg-stage
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ffmpegBundle = Join-Path $env:GITHUB_WORKSPACE 'Backdoor/desktop/src-tauri/ffmpeg'
          New-Item -ItemType Directory -Force -Path $ffmpegBundle | Out-Null
          $ffmpegExe = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib/ffmpeg') -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib/ffmpeg') -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) { throw 'FFmpeg executables were not found after installation.' }
          Copy-Item $ffmpegExe.FullName $ffmpegBundle
          Copy-Item $ffprobeExe.FullName $ffmpegBundle
          @($ffmpegExe.Directory.FullName, $ffprobeExe.Directory.FullName) | Select-Object -Unique | ForEach-Object {
            Get-ChildItem $_ -Filter '*.dll' | Copy-Item -Destination $ffmpegBundle
          }
      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.ffmpeg-stage.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: Backdoor/desktop/src-tauri/ffmpeg
          key: ffmpeg-windows-x64-chocolatey-v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backdoor -> target
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check Frontdoor/scripts/app.js
          node --check Frontdoor/scripts/tauri-timeline.js
      - name: Check Rust workspace
        run: cargo check --workspace
        working-directory: Backdoor
      - name: Run workspace tests
        run: cargo test --workspace
        working-directory: Backdoor
      - run: cargo build -p pluto-desktop --release
        working-directory: Backdoor
      - name: Assemble portable preview ZIP
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'Pluto-Portable-Windows'
          $runtimeFfmpeg = Join-Path $packageRoot 'ffmpeg'
          $releaseExe = Join-Path $env:GITHUB_WORKSPACE 'Backdoor/target/release/pluto-desktop.exe'
          $portableExe = Join-Path $packageRoot 'Pluto.exe'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'Backdoor/target/release/Pluto-Portable-Windows.zip'
          New-Item -ItemType Directory -Force -Path $runtimeFfmpeg | Out-Null
          Copy-Item $releaseExe $portableExe
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Backdoor/desktop/src-tauri/ffmpeg/ffmpeg.exe') $runtimeFfmpeg
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Backdoor/desktop/src-tauri/ffmpeg/ffprobe.exe') $runtimeFfmpeg
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'Backdoor/desktop/src-tauri/ffmpeg') -Filter '*.dll' | Copy-Item -Destination $runtimeFfmpeg
          @(
            'Pluto portable preview'
            ''
            'Unzip the archive and run Pluto.exe. Keep the ffmpeg folder beside Pluto.exe.'
            'This preview uses the installed Microsoft Edge WebView2 Runtime.'
          ) | Set-Content -Path (Join-Path $packageRoot 'README.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Pluto-Portable-Windows
          if-no-files-found: error
          path: Backdoor/target/release/Pluto-Portable-Windows.zip
